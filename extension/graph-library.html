<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Graph Library</title><link rel="stylesheet" href="recorder.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="graph-library.css"></head>
<body class="app-page library-page">
  <main>
    <header class="library-header"><h1>Graph Library</h1>
    <a class="models-link" href="model-cache.html" data-page="model-cache.html">Models</a></header>
    <p id="errors" role="alert"></p><p id="library-warning" role="status"></p>
    <div class="library-workspace">
      <section id="graphs" class="library-list" aria-labelledby="graphs-title">
        <div class="section-heading">
          <h2 id="graphs-title">Graphs <span id="graph-count" class="muted"></span></h2>
          <div class="actions library-actions"><button id="new" class="primary">+ New Graph</button><button id="import">Import JSON</button></div>
        </div>
        <div class="library-toolbar">
          <input id="search" type="search" aria-label="Search graphs" placeholder="Search graphs…">
          <input id="import-file" type="file" accept=".json,application/json" hidden>
        </div>
        <ul id="graph-list" aria-label="Saved graphs"></ul>
        <p id="empty" hidden>No matching graphs.</p>
        <section id="recovery" class="panel" hidden><h2>Storage recovery</h2><p id="recovery-message"></p><div class="actions"><button id="export-storage">Export original library storage</button><button id="export-legacy">Export original legacy JSON</button><button id="recover-legacy">Keep changed legacy graph as new entry</button></div></section>

        <section id="selected" class="library-detail" aria-labelledby="selected-title" hidden>
          <p id="details-error" role="alert"></p>
          <h2 id="selected-title" class="detail-title"></h2>
          <p id="selected-error" role="status"></p>
          <div class="actions detail-actions">
            <a id="open" class="open-graph primary" href="graph-editor.html">Edit graph</a><button id="duplicate">Duplicate</button>
            <button id="export">Export JSON</button>
            <button id="delete" class="danger" aria-describedby="delete-hint">Delete graph</button>
          </div>
          <p id="delete-hint" class="muted"></p>
          <form id="details-form">
            <label>Name<input id="graph-name" required maxlength="160" aria-describedby="details-state"></label>
            <label>Description<textarea id="graph-description" rows="2" maxlength="2000" aria-describedby="details-state"></textarea></label>
            <div class="details-save-status"><span id="details-state" role="status" class="muted"></span><button id="retry-details" type="button" hidden>Retry saving</button></div>
          </form>
          <button id="load-details" hidden>Load saved details</button>
          <dl class="required-models"><dt>Required models</dt><dd id="graph-models"></dd></dl>
        </section>
      </section>
    </div>

  </main>
  <script type="module" src="navigation.js"></script><script type="module" src="graph-library-page.js"></script>
</body></html>
