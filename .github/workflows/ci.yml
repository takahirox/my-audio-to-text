name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path native/macos
