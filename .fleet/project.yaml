schema_version: 2
commands: {}
rules:
  - value: "Issue #2 is design exploration, not an adoption decision."
    provenance: "explicit"
  - value: "Do not claim measurements that were not performed."
    provenance: "explicit"
paths:
  writable: ["docs/issue-2/**"]
  protected:
    - ".git/**"
    - ".fleet/**"
    - "Package.swift"
    - "Sources/**"
    - "Tests/**"
    - "Support/**"
    - "scripts/**"
    - "README.md"
  generated: []
verification:
  required: []
  evidence_freshness: "exact_diff"
  review:
    required: true
    block_severities: ["critical", "high"]
network:
  mode: "disabled"
  https_domains: []
  ports: []
install:
  ecosystems: []
  existing_lock: "deny"
  new_dependency: "deny"
  manifest_lock_mutation: "deny"
  lifecycle_scripts: "deny"
  new_registry_domain: "deny"
  host_global: "deny"
approvals:
  process_shell: "deny"
  new_dependency: "deny"
  manifest_lock_mutation: "deny"
  lifecycle_scripts: "deny"
  new_registry_domain: "deny"
  promotion: "required"
worker:
  preferred: "codex_cli"
  allowed: ["codex_cli"]
budgets:
  wall_seconds: 900.0
  worker_turns: 1
  processes: 0
  download_bytes: 0
  artifact_bytes: 10000000
